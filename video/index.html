<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #101022;
}
#root {
  position: relative;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
#scene {
  position: absolute;
  width: 100%;
  height: 100%;
}
#title {
  position: absolute;
  top: 170px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 76px;
  font-weight: bold;
}
#title span {
  color: #77aaff;
}
#caption {
  position: absolute;
  bottom: 220px;
  left: 140px;
  right: 140px;
  padding: 30px;
  background: #ffd43b;
  border-radius: 24px;
  text-align: center;
  font-size: 48px;
  font-weight: bold;
  color: #171717;
}
</style>
</head>
<body>
<div id="root" data-composition-id="main"
data-start="0" data-duration="5"
data-width="1080" data-height="1920">

<svg id="scene" viewBox="0 0 1080 1920">
<defs>
  <radialGradient id="light">
    <stop offset="0%" stop-color="#ffe6a1"/>
    <stop offset="100%" stop-color="#ffe6a1" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bg" x2="0" y2="1">
    <stop stop-color="#17142d"/>
    <stop offset="1" stop-color="#443124"/>
  </linearGradient>
</defs>

<rect width="1080" height="1920" fill="url(#bg)"/>

<path d="M0 0 L360 0 L280 550 L400 940 L230 1500 L0 1920Z" fill="#201b30"/>
<path d="M1080 0 L730 0 L800 620 L680 1020 L860 1500 L1080 1920Z" fill="#292237"/>

<ellipse id="glow" cx="540" cy="1050" rx="410" ry="480" fill="url(#light)" opacity=".5"/>

<path d="M0 1500 Q540 1300 1080 1500 L1080 1920 L0 1920Z" fill="#302a28"/>

<g id="door">
  <rect x="400" y="790" width="280" height="550" rx="120" fill="#191921" stroke="#967954" stroke-width="22"/>
  <path d="M540 800 V1330" stroke="#f7c978" stroke-width="9"/>
</g>

<g id="explorer">
  <circle cx="540" cy="1370" r="45" fill="#ddb58c"/>
  <rect x="495" y="1410" width="90" height="135" rx="28" fill="#7796a6"/>
  <path d="M518 1540 L505 1650 M562 1540 L575 1650" stroke="#24252e" stroke-width="30" stroke-linecap="round"/>
</g>
</svg>

<div id="title">
  Encontraron algo<br><span>BAJO TIERRA</span>
</div>

<div id="caption">
  Nadie sabía qué había dentro
</div>

</div>

<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused:true});

tl.fromTo("#scene",
  {scale:1},
  {scale:1.15,duration:5,ease:"none"},0);

tl.from("#title",
  {opacity:0,y:-60,duration:0.8},0);

tl.from("#explorer",
  {y:100,opacity:0,duration:1.4},0.5);

tl.to("#glow",
  {opacity:0.95,duration:3},1);

tl.from("#caption",
  {opacity:0,y:70,duration:0.7},2);

window.__timelines.main = tl;
</script>
</body>
</html>
