name: Render HyperFrames Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            mkdir -p "$HOME/ffmpeg"
            curl -fL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
            echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
            export PATH="$HOME/ffmpeg:$PATH"
          fi
          ffmpeg -version
          ffprobe -version

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/hyperframes
            ~/.cache/puppeteer
          key: hyperframes-linux-v1

      - name: Install HyperFrames
        run: npm install -g hyperframes

      - name: Render video
        working-directory: ./video
        run: hyperframes render --output output.mp4 --fps 30 --quality standard

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: video/output.mp4
          if-no-files-found: error
