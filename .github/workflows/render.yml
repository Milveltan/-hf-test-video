name: Render HyperFrames Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            mkdir -p "$HOME/ffmpeg"
            curl -fL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
            echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
            export PATH="$HOME/ffmpeg:$PATH"
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/hyperframes
            ~/.cache/puppeteer
          key: hyperframes-linux-v2-0.9.91

      - name: Unpack project ZIP
        working-directory: ./video
        run: |
          if [ -f proyecto.zip ]; then
            unzip -o proyecto.zip
            echo "proyecto.zip descomprimido sobre la biblioteca permanente"
          else
            echo "No hay proyecto.zip; se usan los archivos sueltos"
          fi
          ls -la

      - name: Install HyperFrames
        run: npm install -g hyperframes@0.9.91

      - name: Sync captions with real audio
        working-directory: ./video
        continue-on-error: true
        run: |
          if [ -f script.txt ] && [ -f tools/align.mjs ]; then
            hyperframes transcribe voice.mp3 --language es --model medium --engine whisper --timeout 900000
            node tools/align.mjs
          else
            echo "Sin script.txt: se omite la sincronizacion"
          fi

      - name: Check composition
        working-directory: ./video
        continue-on-error: true
        run: hyperframes lint .

      - name: Render video
        working-directory: ./video
        run: hyperframes render --output output.mp4 --fps 30 --quality standard

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: |
            video/output.mp4
            video/sync-report.txt
          if-no-files-found: error

      # NUEVO: guarda en el repo la biblioteca (lib, tools, assets) y el archivo del episodio.
      # Corre solo si el render salió bien y nunca hace fallar el workflow.
      - name: Save permanent library
        if: success()
        continue-on-error: true
        run: |
          SLUG=$(cat video/episodio.txt 2>/dev/null | tr -cd 'a-z0-9-' | head -c 60)
          if [ -n "$SLUG" ]; then
            mkdir -p "video/episodios/$SLUG"
            for f in scenes.js script.txt captions.js index.html sync-report.txt; do
              [ -f "video/$f" ] && cp "video/$f" "video/episodios/$SLUG/"
            done
          fi
          git config user.name "datologo-bot"
          git config user.email "datologo-bot@users.noreply.github.com"
          for d in video/lib video/tools video/assets video/episodios; do
            [ -e "$d" ] && git add "$d"
          done
          if git diff --cached --quiet; then
            echo "Biblioteca sin cambios"
          else
            git commit -m "Biblioteca: recursos del video ${SLUG:-sin-nombre}"
            git push
          fi
