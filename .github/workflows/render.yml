name: Render HyperFrames Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            mkdir -p "$HOME/ffmpeg"
            curl -fL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
            echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
            export PATH="$HOME/ffmpeg:$PATH"
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/hyperframes
            ~/.cache/puppeteer
          key: hyperframes-linux-v2-0.9.91

      - name: Unpack project ZIP
        working-directory: ./video
        run: |
          if [ -f proyecto.zip ]; then
            unzip -o proyecto.zip
            echo "proyecto.zip descomprimido sobre la biblioteca permanente"
          else
            echo "No hay proyecto.zip; se usan los archivos sueltos"
          fi
          ls -la

      - name: Install HyperFrames
        run: npm install -g hyperframes@0.9.91

      - name: Sync captions with real audio
        working-directory: ./video
        run: |
          set -euo pipefail
          test -s script.txt
          test -s voice.mp3
          test -s tools/align.mjs
          rm -f transcript.json voice.json voice.transcript.json sync-report.txt captions/transcript.json
          hyperframes transcribe voice.mp3 --language es --model medium --engine whisper --timeout 900000
          node tools/align.mjs
          python3 - <<'PY'
          import re
          from pathlib import Path
          report = Path("sync-report.txt").read_text()
          m = re.search(r"Palabras del guion alineadas:\s*([\d.]+)\s*%", report)
          if not m or float(m.group(1)) < 95:
              raise SystemExit("Alineacion insuficiente: " + report)
          PY

      - name: Check composition
        working-directory: ./video
        continue-on-error: true
        run: hyperframes lint .

      - name: Render video
        working-directory: ./video
        run: hyperframes render --output output.mp4 --fps 30 --quality standard

      - name: Verify output
        working-directory: ./video
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          def probe(p):
              return json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",p]))
          d=probe("output.mp4")
          v=next(s for s in d["streams"] if s["codec_type"]=="video")
          assert (v["width"],v["height"])==(1080,1080), "Resolucion incorrecta"
          assert v["avg_frame_rate"]=="30/1", "FPS incorrectos"
          assert any(s["codec_type"]=="audio" for s in d["streams"]), "Sin audio"
          assert abs(float(d["format"]["duration"])-float(probe("voice.mp3")["format"]["duration"])) < 0.25, "Duracion incorrecta"
          PY

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: |
            video/output.mp4
            video/sync-report.txt
          if-no-files-found: error

